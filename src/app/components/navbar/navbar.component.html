<header class="navbar" [class.scrolled]="scrolled()" [class.menu-open]="menuOpen()">
  <div class="container navbar-inner">
    <a href="#home" class="logo" (click)="closeMenu()">
      <span class="logo-icon">JK</span>
      <span class="logo-text">{{ portfolio.name }}</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links">
      @for (link of navLinks; track link.href) {
        <a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a href="#contact" class="btn btn-primary nav-cta" (click)="closeMenu()">Get in Touch</a>
    </nav>
  </div>
</header>
